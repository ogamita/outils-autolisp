stages:
  - build
  - test
  - benchmark

variables:
  GIT_SUBMODULE_STRATEGY: none
  # CLAUTOLISP_REF_<PLATEFORME> : tag/branche de clautolisp à cloner et
  # compiler pour cette plateforme, ou "local" pour sauter le clone/build et
  # utiliser le clautolisp/alfe déjà installé sur le runner (sous
  # CLAUTOLISP_LOCAL_PREFIX). Une variable par plateforme et non une seule
  # variable globale : GitLab CI n'a pas de variable "dictionnaire" (valeurs
  # scalaires uniquement), et linux (docker, éphémère) veut d'ordinaire un
  # clone taggé alors que macos/windows (shell, persistant) veulent
  # d'ordinaire l'installation locale — chaque job référence la variable de
  # sa propre plateforme, connue statiquement par ses tags. Voir
  # gitlab-ci-rules.md § 6 (C10-C12).
  CLAUTOLISP_REF_LINUX:   "release-1.3"  # docker, éphémère : build à chaque run
  CLAUTOLISP_REF_MACOS:   "local"        # shell, persistant : déjà installé
  CLAUTOLISP_REF_WINDOWS: "local"        # shell, persistant : déjà installé
  CLAUTOLISP_PREFIX: "$CI_PROJECT_DIR/.clautolisp"
  CLAUTOLISP_LOCAL_PREFIX: "/opt/local"
  CLAUTOLISP_GIT_URL: "https://gitlab.com/ogamita/clautolisp.git"

# Deux instances GitLab avec des runners différents :
#   - gitlab.com (pjb-cimon) : runners taggés <os>+<exécuteur> (linux/docker,
#     macos/shell, windows/shell).
#   - fabrik.sncf.fr : runners d'instance (partagés) SANS tags → il faut des
#     jobs SANS tags. On duplique donc les jobs Linux (docker) : variante taggée
#     pour gitlab.com, variante non taggée pour fabrik, sélectionnées par
#     $CI_SERVER_HOST. (Un tag vide via variable ne marche pas : GitLab ne
#     ferait matcher aucun runner.)
# Les runners CAO (macOS/Windows) n'existent que sur gitlab.com.

# ===========================================================================
# LINUX (docker) : build de clautolisp stable puis suites headless.
# ===========================================================================

.build-clautolisp:
  stage: build
  image: debian:bookworm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends make bash perl sbcl git curl ca-certificates
    - curl -fsSL https://beta.quicklisp.org/quicklisp.lisp -o /tmp/quicklisp.lisp
    - 'sbcl --non-interactive --load /tmp/quicklisp.lisp --eval "(quicklisp-quickstart:install)" --eval "(ql-util:without-prompting (ql:add-to-init-file))"'
  script:
    - 'git clone --depth 1 --branch "$CLAUTOLISP_REF_LINUX" "$CLAUTOLISP_GIT_URL" clautolisp-stable'
    - make -C clautolisp-stable build-programs
    - 'make -C clautolisp-stable install-programs PREFIX="$CLAUTOLISP_PREFIX"'
    - '"$CLAUTOLISP_PREFIX/bin/clautolisp" --version'
    - '"$CLAUTOLISP_PREFIX/bin/alfe" --version'
  artifacts:
    paths:
      - .clautolisp/
    expire_in: 1 day

build:clautolisp:
  extends: .build-clautolisp
  tags: [linux, docker]
  rules:
    - if: '$CI_SERVER_HOST != "fabrik.sncf.fr" && $CLAUTOLISP_REF_LINUX != "local"'

build:clautolisp:fabrik:
  extends: .build-clautolisp
  rules:
    - if: '$CI_SERVER_HOST == "fabrik.sncf.fr" && $CLAUTOLISP_REF_LINUX != "local"'

# Bascule le PATH sur les binaires clautolisp/alfe : ceux tout juste compilés
# (CLAUTOLISP_PREFIX, artefact de build:clautolisp*) ou ceux déjà installés
# sur le runner (CLAUTOLISP_LOCAL_PREFIX) quand CLAUTOLISP_REF_LINUX=local —
# auquel cas build:clautolisp* n'existe pas (cf. rules ci-dessus).
.clautolisp-env:
  before_script:
    - |
      if [ "$CLAUTOLISP_REF_LINUX" = "local" ]; then
        export PATH="$CLAUTOLISP_LOCAL_PREFIX/bin:$PATH"
      else
        export PATH="$CLAUTOLISP_PREFIX/bin:$PATH"
      fi

.linux-test:
  stage: test
  image: debian:bookworm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends make bash perl
    - !reference [.clautolisp-env, before_script]

.linux-clautolisp:
  extends: .linux-test
  parallel:
    matrix:
      - SUBPROJECT: [autolisp-algetypes, autolisp-vector, autolisp-hash-table, autolisp-json, autolisp-doc, autolisp-misc]
  script:
    - 'make -C "$SUBPROJECT" test-clautolisp'

linux:clautolisp:
  extends: .linux-clautolisp
  tags: [linux, docker]
  needs:
    - job: build:clautolisp
      optional: true
  rules:
    - if: '$CI_SERVER_HOST != "fabrik.sncf.fr"'

linux:clautolisp:fabrik:
  extends: .linux-clautolisp
  needs:
    - job: build:clautolisp:fabrik
      optional: true
  rules:
    - if: '$CI_SERVER_HOST == "fabrik.sncf.fr"'

# (autolisp-script est déprécié — remplacé par alfe ; ses tests sont retirés.)

# ===========================================================================
# BENCHMARK (Linux/docker, à la fin des tests) : vitesse des structures vs
# liste/a-list. Résultats sur le log ET dans l'artefact benchmark-results.txt.
# ===========================================================================

.benchmark:
  stage: benchmark
  image: debian:bookworm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends make bash perl
    - !reference [.clautolisp-env, before_script]
  script:
    - make benchmark BACKEND=clautolisp
  artifacts:
    paths:
      - benchmark-results.txt
    when: always
    expire_in: 30 days

benchmark:
  extends: .benchmark
  tags: [linux, docker]
  rules:
    - if: '$CI_SERVER_HOST != "fabrik.sncf.fr"'

benchmark:fabrik:
  extends: .benchmark
  rules:
    - if: '$CI_SERVER_HOST == "fabrik.sncf.fr"'

# ===========================================================================
# macOS / Windows (shell, gitlab.com uniquement) : moteurs installés localement.
# Un seul job par moteur (un clic = toute la série). Auto sur release-*, manuel
# sinon. Jamais sur fabrik (pas de runner macOS/Windows).
#
# Pas de job de build source sur ces plateformes (runners shell persistants,
# parfois un PC intermittent pour Windows) : CLAUTOLISP_REF_MACOS et
# CLAUTOLISP_REF_WINDOWS ne supportent donc que "local" pour l'instant. La
# garde en tête de script transforme une valeur différente en échec explicite
# plutôt qu'en no-op silencieux (cf. gitlab-ci-rules.md C3/C4 et C12).
# ===========================================================================

.on-release-or-manual:
  stage: test
  rules:
    - if: '$CI_SERVER_HOST == "fabrik.sncf.fr"'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^release-/'
    - when: manual
  allow_failure: true

macos:clautolisp:
  extends: .on-release-or-manual
  tags: [macos, shell]
  script:
    - 'if [ "$CLAUTOLISP_REF_MACOS" != "local" ]; then echo "CLAUTOLISP_REF_MACOS=$CLAUTOLISP_REF_MACOS non supporté : seul \"local\" est implémenté sur macOS (pas de job de build source)."; exit 1; fi'
    - make test-clautolisp

macos:bricscad:
  extends: .on-release-or-manual
  tags: [macos, shell]
  script:
    - 'if [ "$CLAUTOLISP_REF_MACOS" != "local" ]; then echo "CLAUTOLISP_REF_MACOS=$CLAUTOLISP_REF_MACOS non supporté : seul \"local\" est implémenté sur macOS (pas de job de build source)."; exit 1; fi'
    - make test-bricscad

windows:clautolisp:
  extends: .on-release-or-manual
  tags: [windows, shell]
  script:
    - 'if ($env:CLAUTOLISP_REF_WINDOWS -ne "local") { Write-Host "CLAUTOLISP_REF_WINDOWS=$env:CLAUTOLISP_REF_WINDOWS non supporte : seul ''local'' est implemente sur Windows (pas de job de build source)."; exit 1 }'
    - 'foreach ($d in "autolisp-algetypes","autolisp-vector","autolisp-hash-table","autolisp-json","autolisp-doc","autolisp-misc") { Write-Host "== $d (clautolisp) =="; make -C $d test-clautolisp; if ($LASTEXITCODE) { exit 1 } }'

windows:bricscad:
  extends: .on-release-or-manual
  tags: [windows, shell]
  script:
    - 'if ($env:CLAUTOLISP_REF_WINDOWS -ne "local") { Write-Host "CLAUTOLISP_REF_WINDOWS=$env:CLAUTOLISP_REF_WINDOWS non supporte : seul ''local'' est implemente sur Windows (pas de job de build source)."; exit 1 }'
    - 'foreach ($d in "autolisp-algetypes","autolisp-vector","autolisp-hash-table","autolisp-json","autolisp-doc") { Write-Host "== $d (bricscad) =="; make -C $d test-bricscad; if ($LASTEXITCODE) { exit 1 } }'

windows:autocad:
  extends: .on-release-or-manual
  tags: [windows, shell]
  script:
    - 'if ($env:CLAUTOLISP_REF_WINDOWS -ne "local") { Write-Host "CLAUTOLISP_REF_WINDOWS=$env:CLAUTOLISP_REF_WINDOWS non supporte : seul ''local'' est implemente sur Windows (pas de job de build source)."; exit 1 }'
    - 'foreach ($d in "autolisp-algetypes","autolisp-vector","autolisp-hash-table","autolisp-json","autolisp-doc") { Write-Host "== $d (autocad) =="; make -C $d test-autocad; if ($LASTEXITCODE) { exit 1 } }'
