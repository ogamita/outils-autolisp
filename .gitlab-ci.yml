stages:
  - build
  - test

variables:
  # third-party/clautolisp est une dépendance bibliothèque (edward/dwg-identifier),
  # pas l'outil de test.
  GIT_SUBMODULE_STRATEGY: none
  CLAUTOLISP_REF: "release-1.3"
  CLAUTOLISP_PREFIX: "$CI_PROJECT_DIR/.clautolisp"
  CLAUTOLISP_GIT_URL: "https://gitlab.com/ogamita/clautolisp.git"

# Tags runner : <os> + <type d'exécuteur> (shell | docker).
#   - [linux, docker]  : peut apt-get → construit clautolisp (release-1.3) et
#                        lance les suites headless. Reproductible, indépendant de
#                        ce qui est installé sur poseidon.
#   - [macos, shell]   : Mac du dev — clautolisp/alfe INSTALLÉS. clautolisp + BricsCAD.
#   - [windows, shell] : PC du dev — INSTALLÉS. clautolisp + BricsCAD + AutoCAD.
#
# macOS/Windows sont redondants avec Linux pour le headless, mais révèlent des
# différences de plateforme. Ils sont AUTO sur les branches release-*, MANUELS
# sinon. Chaque job est unique (pas de matrice) et lance toute la série de
# sous-projets via une cible agrégée du Makefile racine : un seul clic.

# ===========================================================================
# LINUX (docker) : build clautolisp stable puis suites headless. Auto (toujours).
# ===========================================================================

build:clautolisp:
  stage: build
  tags: [linux, docker]
  image: debian:bookworm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends make bash perl sbcl git curl ca-certificates
    # quicklisp (requis par build-programs)
    - curl -fsSL https://beta.quicklisp.org/quicklisp.lisp -o /tmp/quicklisp.lisp
    - 'sbcl --non-interactive --load /tmp/quicklisp.lisp --eval "(quicklisp-quickstart:install)" --eval "(ql-util:without-prompting (ql:add-to-init-file))"'
  script:
    - 'git clone --depth 1 --branch "$CLAUTOLISP_REF" "$CLAUTOLISP_GIT_URL" clautolisp-stable'
    - make -C clautolisp-stable build-programs
    - 'make -C clautolisp-stable install-programs PREFIX="$CLAUTOLISP_PREFIX"'
    - '"$CLAUTOLISP_PREFIX/bin/clautolisp" --version'
    - '"$CLAUTOLISP_PREFIX/bin/alfe" --version'
  artifacts:
    paths:
      - .clautolisp/
    expire_in: 1 day

.linux-test:
  stage: test
  tags: [linux, docker]
  image: debian:bookworm
  needs: ["build:clautolisp"]
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends make bash perl
    - 'export PATH="$CLAUTOLISP_PREFIX/bin:$PATH"'

linux:clautolisp:
  extends: .linux-test
  parallel:
    matrix:
      - SUBPROJECT: [autolisp-vector, autolisp-hash-table, autolisp-json, autolisp-doc, autolisp-misc]
  script:
    - 'make -C "$SUBPROJECT" test-clautolisp'

linux:autolisp-script:
  extends: .linux-test
  script:
    - make -C autolisp-script test-fakecad TEST_TIMEOUT=10

# ===========================================================================
# macOS / Windows (shell) : moteurs installés localement (release-1.3).
# Jobs uniques (un clic = toute la série), auto sur release-*, manuel sinon.
# ===========================================================================

.on-release-or-manual:
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release-/'   # auto sur les branches release
    - when: manual                             # manuel ailleurs
  allow_failure: true

macos:clautolisp:
  extends: .on-release-or-manual
  tags: [macos, shell]
  script:
    - make test-clautolisp

macos:bricscad:
  extends: .on-release-or-manual
  tags: [macos, shell]
  script:
    - make test-bricscad

windows:clautolisp:
  extends: .on-release-or-manual
  tags: [windows, shell]
  script:
    - make test-clautolisp

windows:bricscad:
  extends: .on-release-or-manual
  tags: [windows, shell]
  script:
    - make test-bricscad

windows:autocad:
  extends: .on-release-or-manual
  tags: [windows, shell]
  script:
    - make test-autocad
