stages:
  - test

variables:
  # third-party/clautolisp est une dépendance bibliothèque (edward/dwg-identifier),
  # pas l'outil de test : on ne le récupère pas.
  GIT_SUBMODULE_STRATEGY: none

# Les runners sont des exécuteurs *shell* (pas docker) : clautolisp / alfe / make
# sont supposés INSTALLÉS sur chaque machine (le dev/CI dispose de la release-1.3
# stable). On ne fait donc ni apt-get ni build ici.
#
# Un job s'exécute sur le runner qui possède TOUS ses tags :
#   - [linux]   : poseidon (toujours en ligne) — tests headless clautolisp (auto).
#   - [macos]   : Mac du dev — BricsCAD réel (manuel).
#   - [windows] : PC du dev — BricsCAD + AutoCAD réels (manuel).
#
# Surcharges possibles : CLAUTOLISP=/chemin/clautolisp, ALFE=/chemin/alfe si les
# binaires ne sont pas dans le PATH par défaut du runner.

# ===========================================================================
# LINUX (poseidon) : suites headless clautolisp. Automatique.
# ===========================================================================

linux:clautolisp:
  stage: test
  tags: [linux]
  parallel:
    matrix:
      - SUBPROJECT: [autolisp-vector, autolisp-hash-table, autolisp-json, autolisp-doc, autolisp-misc]
  script:
    - 'make -C "$SUBPROJECT" test-clautolisp'

linux:autolisp-script:
  stage: test
  tags: [linux]
  script:
    - make -C autolisp-script test-fakecad TEST_TIMEOUT=10

# ===========================================================================
# macOS : BricsCAD réel. Sur demande (runner intermittent).
# ===========================================================================

macos:bricscad:
  stage: test
  tags: [macos]
  rules:
    - when: manual
  allow_failure: true
  parallel:
    matrix:
      - SUBPROJECT: [autolisp-vector, autolisp-hash-table, autolisp-json, autolisp-doc]
  script:
    - 'make -C "$SUBPROJECT" test-bricscad'

# ===========================================================================
# Windows : BricsCAD + AutoCAD réels. Sur demande (runner intermittent).
# ===========================================================================

windows:bricscad:
  stage: test
  tags: [windows]
  rules:
    - when: manual
  allow_failure: true
  parallel:
    matrix:
      - SUBPROJECT: [autolisp-vector, autolisp-hash-table, autolisp-json, autolisp-doc]
  script:
    - 'make -C "$SUBPROJECT" test-bricscad'

windows:autocad:
  stage: test
  tags: [windows]
  rules:
    - when: manual
  allow_failure: true
  parallel:
    matrix:
      - SUBPROJECT: [autolisp-vector, autolisp-hash-table, autolisp-json, autolisp-doc]
  script:
    - 'make -C "$SUBPROJECT" test-autocad'
