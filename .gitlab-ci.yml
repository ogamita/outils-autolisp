stages:
  - build
  - test
  - benchmark

variables:
  GIT_SUBMODULE_STRATEGY: none
  CLAUTOLISP_REF: "release-1.3"
  CLAUTOLISP_PREFIX: "$CI_PROJECT_DIR/.clautolisp"
  CLAUTOLISP_GIT_URL: "https://gitlab.com/ogamita/clautolisp.git"

# Deux instances GitLab avec des runners différents :
#   - gitlab.com (pjb-cimon) : runners taggés <os>+<exécuteur> (linux/docker,
#     macos/shell, windows/shell).
#   - fabrik.sncf.fr : runners d'instance (partagés) SANS tags → il faut des
#     jobs SANS tags. On duplique donc les jobs Linux (docker) : variante taggée
#     pour gitlab.com, variante non taggée pour fabrik, sélectionnées par
#     $CI_SERVER_HOST. (Un tag vide via variable ne marche pas : GitLab ne
#     ferait matcher aucun runner.)
# Les runners CAO (macOS/Windows) n'existent que sur gitlab.com.

# ===========================================================================
# LINUX (docker) : build de clautolisp stable puis suites headless.
# ===========================================================================

.build-clautolisp:
  stage: build
  image: debian:bookworm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends make bash perl sbcl git curl ca-certificates
    - curl -fsSL https://beta.quicklisp.org/quicklisp.lisp -o /tmp/quicklisp.lisp
    - 'sbcl --non-interactive --load /tmp/quicklisp.lisp --eval "(quicklisp-quickstart:install)" --eval "(ql-util:without-prompting (ql:add-to-init-file))"'
  script:
    - 'git clone --depth 1 --branch "$CLAUTOLISP_REF" "$CLAUTOLISP_GIT_URL" clautolisp-stable'
    - make -C clautolisp-stable build-programs
    - 'make -C clautolisp-stable install-programs PREFIX="$CLAUTOLISP_PREFIX"'
    - '"$CLAUTOLISP_PREFIX/bin/clautolisp" --version'
    - '"$CLAUTOLISP_PREFIX/bin/alfe" --version'
  artifacts:
    paths:
      - .clautolisp/
    expire_in: 1 day

build:clautolisp:
  extends: .build-clautolisp
  tags: [linux, docker]
  rules:
    - if: '$CI_SERVER_HOST != "fabrik.sncf.fr"'

build:clautolisp:fabrik:
  extends: .build-clautolisp
  rules:
    - if: '$CI_SERVER_HOST == "fabrik.sncf.fr"'

.linux-test:
  stage: test
  image: debian:bookworm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends make bash perl
    - 'export PATH="$CLAUTOLISP_PREFIX/bin:$PATH"'

.linux-clautolisp:
  extends: .linux-test
  parallel:
    matrix:
      - SUBPROJECT: [autolisp-algetypes, autolisp-vector, autolisp-hash-table, autolisp-json, autolisp-doc, autolisp-misc]
  script:
    - 'make -C "$SUBPROJECT" test-clautolisp'

linux:clautolisp:
  extends: .linux-clautolisp
  tags: [linux, docker]
  needs: ["build:clautolisp"]
  rules:
    - if: '$CI_SERVER_HOST != "fabrik.sncf.fr"'

linux:clautolisp:fabrik:
  extends: .linux-clautolisp
  needs: ["build:clautolisp:fabrik"]
  rules:
    - if: '$CI_SERVER_HOST == "fabrik.sncf.fr"'

# (autolisp-script est déprécié — remplacé par alfe ; ses tests sont retirés.)

# ===========================================================================
# BENCHMARK (Linux/docker, à la fin des tests) : vitesse des structures vs
# liste/a-list. Résultats sur le log ET dans l'artefact benchmark-results.txt.
# ===========================================================================

.benchmark:
  stage: benchmark
  image: debian:bookworm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends make bash perl
    - 'export PATH="$CLAUTOLISP_PREFIX/bin:$PATH"'
  script:
    - make benchmark BACKEND=clautolisp
  artifacts:
    paths:
      - benchmark-results.txt
    when: always
    expire_in: 30 days

benchmark:
  extends: .benchmark
  tags: [linux, docker]
  rules:
    - if: '$CI_SERVER_HOST != "fabrik.sncf.fr"'

benchmark:fabrik:
  extends: .benchmark
  rules:
    - if: '$CI_SERVER_HOST == "fabrik.sncf.fr"'

# ===========================================================================
# macOS / Windows (shell, gitlab.com uniquement) : moteurs installés localement.
# Un seul job par moteur (un clic = toute la série). Auto sur release-*, manuel
# sinon. Jamais sur fabrik (pas de runner macOS/Windows).
# ===========================================================================

.on-release-or-manual:
  stage: test
  rules:
    - if: '$CI_SERVER_HOST == "fabrik.sncf.fr"'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^release-/'
    - when: manual
  allow_failure: true

macos:clautolisp:
  extends: .on-release-or-manual
  tags: [macos, shell]
  script:
    - make test-clautolisp

macos:bricscad:
  extends: .on-release-or-manual
  tags: [macos, shell]
  script:
    - make test-bricscad

windows:clautolisp:
  extends: .on-release-or-manual
  tags: [windows, shell]
  script:
    - 'foreach ($d in "autolisp-algetypes","autolisp-vector","autolisp-hash-table","autolisp-json","autolisp-doc","autolisp-misc") { Write-Host "== $d (clautolisp) =="; make -C $d test-clautolisp; if ($LASTEXITCODE) { exit 1 } }'

windows:bricscad:
  extends: .on-release-or-manual
  tags: [windows, shell]
  script:
    - 'foreach ($d in "autolisp-algetypes","autolisp-vector","autolisp-hash-table","autolisp-json","autolisp-doc") { Write-Host "== $d (bricscad) =="; make -C $d test-bricscad; if ($LASTEXITCODE) { exit 1 } }'

windows:autocad:
  extends: .on-release-or-manual
  tags: [windows, shell]
  script:
    - 'foreach ($d in "autolisp-algetypes","autolisp-vector","autolisp-hash-table","autolisp-json","autolisp-doc") { Write-Host "== $d (autocad) =="; make -C $d test-autocad; if ($LASTEXITCODE) { exit 1 } }'
