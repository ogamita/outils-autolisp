stages:
  - build
  - test

variables:
  # third-party/clautolisp est une dépendance bibliothèque (edward/dwg-identifier),
  # pas l'outil de test.
  GIT_SUBMODULE_STRATEGY: none
  CLAUTOLISP_REF: "release-1.3"
  CLAUTOLISP_PREFIX: "$CI_PROJECT_DIR/.clautolisp"
  CLAUTOLISP_GIT_URL: "https://gitlab.com/ogamita/clautolisp.git"

# Tags runner : <os> + <type d'exécuteur> (shell | docker).
#   - [linux, docker]  : exécuteur docker → peut apt-get et construire clautolisp
#                        (release-1.3) ; y lance aussi les suites headless.
#   - [macos, shell]   : Mac du dev (shell) — clautolisp/alfe INSTALLÉS.
#   - [windows, shell] : PC du dev (shell) — alfe/clautolisp INSTALLÉS.
# macOS/Windows sont des portables intermittents : jobs `when: manual`.

# ===========================================================================
# LINUX (docker) : build de clautolisp stable puis suites headless. Auto.
# ===========================================================================

build:clautolisp:
  stage: build
  tags: [linux, docker]
  image: debian:bookworm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends make bash perl sbcl git curl ca-certificates
    # quicklisp (requis par build-programs)
    - curl -fsSL https://beta.quicklisp.org/quicklisp.lisp -o /tmp/quicklisp.lisp
    - 'sbcl --non-interactive --load /tmp/quicklisp.lisp --eval "(quicklisp-quickstart:install)" --eval "(ql-util:without-prompting (ql:add-to-init-file))"'
  script:
    - 'git clone --depth 1 --branch "$CLAUTOLISP_REF" "$CLAUTOLISP_GIT_URL" clautolisp-stable'
    - make -C clautolisp-stable build-programs
    - 'make -C clautolisp-stable install-programs PREFIX="$CLAUTOLISP_PREFIX"'
    - '"$CLAUTOLISP_PREFIX/bin/clautolisp" --version'
    - '"$CLAUTOLISP_PREFIX/bin/alfe" --version'
  artifacts:
    paths:
      - .clautolisp/
    expire_in: 1 day

.linux-test:
  stage: test
  tags: [linux, docker]
  image: debian:bookworm
  needs: ["build:clautolisp"]
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends make bash perl
    - 'export PATH="$CLAUTOLISP_PREFIX/bin:$PATH"'

linux:clautolisp:
  extends: .linux-test
  parallel:
    matrix:
      - SUBPROJECT: [autolisp-vector, autolisp-hash-table, autolisp-json, autolisp-doc, autolisp-misc]
  script:
    - 'make -C "$SUBPROJECT" test-clautolisp'

linux:autolisp-script:
  extends: .linux-test
  script:
    - make -C autolisp-script test-fakecad TEST_TIMEOUT=10

# ===========================================================================
# macOS (shell) : headless clautolisp + BricsCAD réel. Sur demande.
# clautolisp/alfe installés (release-1.3).
# ===========================================================================

macos:clautolisp:
  stage: test
  tags: [macos, shell]
  rules:
    - when: manual
  allow_failure: true
  parallel:
    matrix:
      - SUBPROJECT: [autolisp-vector, autolisp-hash-table, autolisp-json, autolisp-doc, autolisp-misc]
  script:
    - 'make -C "$SUBPROJECT" test-clautolisp'

macos:bricscad:
  stage: test
  tags: [macos, shell]
  rules:
    - when: manual
  allow_failure: true
  parallel:
    matrix:
      - SUBPROJECT: [autolisp-vector, autolisp-hash-table, autolisp-json, autolisp-doc]
  script:
    - 'make -C "$SUBPROJECT" test-bricscad'

# ===========================================================================
# Windows (shell) : BricsCAD + AutoCAD réels. Sur demande.
# ===========================================================================

windows:bricscad:
  stage: test
  tags: [windows, shell]
  rules:
    - when: manual
  allow_failure: true
  parallel:
    matrix:
      - SUBPROJECT: [autolisp-vector, autolisp-hash-table, autolisp-json, autolisp-doc]
  script:
    - 'make -C "$SUBPROJECT" test-bricscad'

windows:autocad:
  stage: test
  tags: [windows, shell]
  rules:
    - when: manual
  allow_failure: true
  parallel:
    matrix:
      - SUBPROJECT: [autolisp-vector, autolisp-hash-table, autolisp-json, autolisp-doc]
  script:
    - 'make -C "$SUBPROJECT" test-autocad'
