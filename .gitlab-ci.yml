stages:
  - build
  - test

variables:
  # Le clautolisp/alfe des TESTS n'est PAS celui de third-party/clautolisp
  # (celui-ci est une dépendance bibliothèque d'edward/dwg-identifier et peut
  # être sur une tout autre branche). On construit une version STABLE clonée
  # depuis la branche release-1.3 de clautolisp.
  GIT_SUBMODULE_STRATEGY: none
  CLAUTOLISP_REF: "release-1.3"
  CLAUTOLISP_PREFIX: "$CI_PROJECT_DIR/.clautolisp"
  # URL de clone de clautolisp. Dépôt public : aucun token nécessaire.
  CLAUTOLISP_GIT_URL: "https://gitlab.com/ogamita/clautolisp.git"
  # Tag utilisateur des runners CAO (Windows). NON stocké ici : fourni
  # dynamiquement au push, p.ex. :
  #   git push -o ci.variable="WINDOWS_USER_TAG=pjb"
  WINDOWS_USER_TAG: ""

# ---------------------------------------------------------------------------
# Build : clautolisp/alfe stables depuis release-1.3 (sbcl + quicklisp, rapide).
# Une image récente avec sbcl convient (CLAUTOLISP_BUILD_IMAGE).
# ---------------------------------------------------------------------------

build:clautolisp:
  stage: build
  image: debian:bookworm
  tags: [linux, amd64, docker]
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends make bash perl sbcl git curl ca-certificates
    # quicklisp (requis par build-programs)
    - curl -fsSL https://beta.quicklisp.org/quicklisp.lisp -o /tmp/quicklisp.lisp
    - sbcl --non-interactive --load /tmp/quicklisp.lisp --eval "(quicklisp-quickstart:install)" --eval "(ql-util:without-prompting (ql:add-to-init-file))"
  script:
    - git clone --depth 1 --branch "$CLAUTOLISP_REF" "$CLAUTOLISP_GIT_URL" clautolisp-stable
    - make -C clautolisp-stable build-programs
    - make -C clautolisp-stable install-programs PREFIX="$CLAUTOLISP_PREFIX"
    - "$CLAUTOLISP_PREFIX/bin/clautolisp" --version
    - "$CLAUTOLISP_PREFIX/bin/alfe" --version
  artifacts:
    paths:
      - .clautolisp/
    expire_in: 1 day

# ---------------------------------------------------------------------------
# Linux (headless) : tests de chaque sous-projet via le clautolisp stable.
# ---------------------------------------------------------------------------

.linux-test:
  stage: test
  image: debian:bookworm
  tags: [linux, amd64, docker]
  needs: ["build:clautolisp"]
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends make bash perl
    - export PATH="$CLAUTOLISP_PREFIX/bin:$PATH"

linux:clautolisp:
  extends: .linux-test
  parallel:
    matrix:
      - SUBPROJECT:
          - autolisp-vector
          - autolisp-hash-table
          - autolisp-json
          - autolisp-doc
          - autolisp-misc
  script:
    - make -C "$SUBPROJECT" test-clautolisp

# autolisp-script : pas de moteur CAO requis (backend fake-CAD).
linux:autolisp-script:
  extends: .linux-test
  script:
    - make -C autolisp-script test-fakecad TEST_TIMEOUT=10

# ---------------------------------------------------------------------------
# Windows : BricsCAD / AutoCAD disponibles. Jobs exécutés uniquement lorsque le
# tag utilisateur est fourni au push (WINDOWS_USER_TAG). Ils tournent sur le
# runner portant les tags [windows, <user>] et restent en file jusqu'à ce que
# ce PC soit en ligne. clautolisp/alfe et make doivent y être installés (le dev
# est censé disposer de la release-1.3 stable installée localement).
# ---------------------------------------------------------------------------

.windows-test:
  stage: test
  tags: [windows, "$WINDOWS_USER_TAG"]
  rules:
    - if: '$WINDOWS_USER_TAG != ""'

windows:bricscad:
  extends: .windows-test
  parallel:
    matrix:
      - SUBPROJECT:
          - autolisp-vector
          - autolisp-hash-table
          - autolisp-json
          - autolisp-doc
  script:
    - make -C "$SUBPROJECT" test-bricscad

windows:autocad:
  extends: .windows-test
  parallel:
    matrix:
      - SUBPROJECT:
          - autolisp-vector
          - autolisp-hash-table
          - autolisp-json
          - autolisp-doc
  script:
    - make -C "$SUBPROJECT" test-autocad
